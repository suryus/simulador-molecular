name: Crear APK de Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Crear estructura del proyecto web
        run: |
          mkdir -p frontend/src
          
          # Crear package.json
          cat << 'EOF' > frontend/package.json
          {
            "name": "simulador-molecular",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^5.7.0",
              "@capacitor/cli": "^5.7.0",
              "@capacitor/core": "^5.7.0",
              "three": "^0.160.0"
            },
            "devDependencies": {
              "typescript": "^5.0.0",
              "vite": "^5.0.0"
            }
          }
          EOF

          # Crear index.html
          cat << 'EOF' > frontend/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
            <title>Simulador Molecular 3D</title>
            <style>
              body { margin: 0; background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
              h1 { color: #38bdf8; font-size: 1.8rem; }
              p { color: #94a3b8; width: 80%; }
            </style>
          </head>
          <body>
            <h1>Simulador Molecular 3D</h1>
            <p>Aplicación Android compilada exitosamente.</p>
          </body>
          </html>
          EOF

      - name: Instalar dependencias y compilar
        run: |
          cd frontend
          npm install
          npm run build
          npx cap init "Simulador Molecular 3D" "com.simulatormolecular.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Renombrar APK en Gradle
        run: |
          cd frontend/android/app
          sed -i '/android {/a \    applicationVariants.all { variant -> variant.outputs.all { output -> outputFileName = "SimuladorMolecular3D-v1.0.0.apk" } }' build.gradle

      - name: Compilar APK con Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorMolecular3D-v1.0.0-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
