name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Crear estructura del proyecto web
        run: |
          mkdir -p frontend/src/services
          
          # Crear package.json
          cat << 'EOF' > frontend/package.json
          {
            "name": "simulador-molecular",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^5.0.0",
              "@capacitor/cli": "^5.0.0",
              "@capacitor/core": "^5.0.0",
              "@rdkit/rdkit": "^2023.9.5",
              "three": "^0.160.0"
            },
            "devDependencies": {
              "typescript": "^5.0.0",
              "vite": "^5.0.0"
            }
          }
          EOF

          # Crear capacitor.config.json
          cat << 'EOF' > frontend/capacitor.config.json
          {
            "appId": "com.simulatormolecular.app",
            "appName": "Simulador Molecular 3D",
            "webDir": "dist"
          }
          EOF

          # Crear index.html
          cat << 'EOF' > frontend/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
            <title>Simulador Molecular 3D</title>
            <script src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
          </head>
          <body style="margin:0; background:#0f172a; color:white; font-family:sans-serif; text-align:center;">
            <h1>Simulador Molecular 3D</h1>
            <p>App compilada exitosamente.</p>
          </body>
          </html>
          EOF

      - name: Instalar dependencias y compilar
        run: |
          cd frontend
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Personalizar nombre del APK
        run: |
          cd frontend/android/app
          sed -i '/android {/a \    applicationVariants.all { variant -> variant.outputs.all { output -> outputFileName = "SimuladorMolecular3D-v1.0.0.apk" } }' build.gradle

      - name: Compilar APK con Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorMolecular3D-v1.0.0-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
